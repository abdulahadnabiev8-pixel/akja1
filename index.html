<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медресе Контракт Көзөмөлү</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Медресе контракты (жылдык: <span id="contractLabel">70,000</span> сом)</h1>
            <p>Жалпы окуучулар: <strong>270</strong></p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Жалпы план (270 окуучу)</h3>
                <div class="value" id="statTotal">0 сом</div>
            </div>
            <div class="stat-card success">
                <h3>Төлөнгөн сумма</h3>
                <div class="value" id="statPaid">0 сом</div>
            </div>
            <div class="stat-card danger">
                <h3>Калган карыз</h3>
                <div class="value" id="statDebt">0 сом</div>
            </div>
        </div>

        <div class="panel">
            <h2>Жаңы төлөм кошуу</h2>
            <form id="paymentForm" class="form-grid">
                <div class="form-group">
                    <label for="name">Окуучунун аты-жөнү</label>
                    <input type="text" id="name" placeholder="Мисалы: Бакыт уулу Адилет" required>
                </div>
                <div class="form-group">
                    <label for="amount">Төлөгөн сумма (сом)</label>
                    <input type="number" id="amount" placeholder="70000" min="1" required>
                </div>
                <div class="form-group">
                    <label for="date">Берилген күнү</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="giver">Ким берди (ата-эси/өзү)</label>
                    <input type="text" id="giver" placeholder="Атасы: Жаныбек">
                </div>
                <div class="form-group">
                    <label for="receiver">Ким алды (кассир/мугалим)</label>
                    <input type="text" id="receiver" placeholder="Устаз Абдулла">
                </div>
                <button type="submit" class="btn">Кошуу</button>
            </form>
        </div>

        <div class="panel search-panel">
            <input type="search" id="search" placeholder="Окуучуну аты боюнча издөө...">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Аты-жөнү</th>
                        <th>Жылдык контракт</th>
                        <th>Төлөдү</th>
                        <th>Калды</th>
                        <th>Берилген күнү</th>
                        <th>Ким берди</th>
                        <th>Ким алды</th>
                        <th>Абалы</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
